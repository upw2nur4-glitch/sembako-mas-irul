<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sembako Mas Irul - Katalog & Pemesanan Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24 md:pb-12">

    <!-- Header / Navbar -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-white text-emerald-700 p-2 rounded-lg shadow">
                    <i class="fa-solid fa-store text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Sembako Mas Irul</h1>
                    <p class="text-xs text-emerald-100">Pemesanan Online & Pengiriman Cepat</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-4">
        <!-- Search & Filter Section -->
        <div class="mb-4 space-y-3">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Cari produk..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <select id="categoryFilter" onchange="filterProducts()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
                    <option value="all">Semua Kategori</option>
                </select>
                <select id="sortFilter" onchange="filterProducts()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm">
                    <option value="default">Urutkan Harga</option>
                    <option value="low-high">Termurah</option>
                    <option value="high-low">Termahal</option>
                </select>
            </div>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
            <div class="col-span-full text-center py-12 text-slate-500 text-sm">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i>
                <p>Memuat katalog produk dari database...</p>
            </div>
        </div>
    </main>

    <!-- Sticky Bottom Cart Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg p-3 z-20 hidden">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-500">Total Estimasi Barang:</p>
                <p id="cartTotalSummary" class="font-bold text-emerald-700 text-base">Rp 0</p>
            </div>
            <button onclick="openCheckoutModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-md flex items-center space-x-2 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Keranjang (<span id="cartCountSummary">0</span>)</span>
            </button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-emerald-700 text-white">
                <h3 class="font-bold text-base"><i class="fa-solid fa-receipt mr-2"></i> Rincian Keranjang Belanja</h3>
                <button onclick="closeCheckoutModal()" class="text-white hover:text-slate-200 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="checkoutItemsList" class="p-4 overflow-y-auto space-y-3 flex-1 divide-y divide-slate-100"></div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="flex justify-between items-center font-bold text-base">
                    <span>Total Belanja:</span>
                    <span id="checkoutGrandTotal" class="text-emerald-700">Rp 0</span>
                </div>
                <button onclick="proceedToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold text-sm shadow-md transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Kirim Pesanan ke WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsOXR80eRQm-MrU9dwJDxtcPrZ36p3MDc9WfJQPB4aPWZ18sfaFVQZHZZ-6px6JdepCCKZ9O6Yr4X0/pub?gid=0&single=true&output=csv";

        let products = [];
        let cart = {};

        function fetchProductsFromSheet() {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        products = results.data.map((item, index) => {
                            let parsedVariants = [];
                            if (item.variants) {
                                parsedVariants = item.variants.split(',').map(v => v.trim()).filter(v => v !== '');
                            }
                            return {
                                id: item.id || (index + 1),
                                name: item.name || 'Produk Tanpa Nama',
                                variants: parsedVariants,
                                costPrice: parseInt(item.costPrice) || 0,
                                price: parseInt(item.price) || 0,
                                category: item.category || 'Lainnya',
                                image: item.image && item.image.startsWith('http') ? item.image : 'https://via.placeholder.com/150'
                            };
                        });
                    }
                    populateCategories();
                    renderProducts(products);
                },
                error: function(err) {
                    console.error("Gagal membaca Google Sheets:", err);
                    document.getElementById('productGrid').innerHTML = '<div class="col-span-full text-center py-8 text-red-500 text-sm">Gagal memuat produk dari Google Sheets.</div>';
                }
            });
        }

        function populateCategories() {
            const categories = ['all', ...new Set(products.map(p => p.category))];
            const select = document.getElementById('categoryFilter');
            select.innerHTML = categories.map(cat => `<option value="${cat}">${cat === 'all' ? 'Semua Kategori' : cat}</option>`).join('');
        }

        function renderProducts(dataToRender) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(dataToRender.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-8 text-slate-400 text-sm">Produk tidak ditemukan</div>';
                return;
            }

            dataToRender.forEach(p => {
                let variantHtml = '';
                if(p.variants && p.variants.length > 0) {
                    variantHtml = `<div class="mb-2"><select id="var-${p.id}" onchange="updateCardQtyDisplay(${p.id})" class="w-full text-xs border border-slate-200 rounded-lg p-1 bg-slate-50 focus:outline-none">${p.variants.map(v => `<option value="${v}">${v}</option>`).join('')}</select></div>`;
                }

                let currentKey = p.variants && p.variants.length > 0 ? `${p.id}_${p.variants[0]}` : `${p.id}_default`;
                let qty = cart[currentKey] || 0;

                let card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-xl p-2.5 shadow-sm flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <img src="${p.image}" alt="${p.name}" class="w-full h-28 object-cover rounded-lg mb-2" onerror="this.src='https://via.placeholder.com/150'">
                        <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                        <h4 class="text-xs font-semibold text-slate-800 line-clamp-2 mt-1">${p.name}</h4>
                        ${variantHtml}
                    </div>
                    <div>
                        <p class="text-xs font-bold text-emerald-700 mb-2">Rp ${p.price.toLocaleString('id-ID')}</p>
                        <div class="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg p-1">
                            <button onclick="changeQty(${p.id}, -1)" class="w-7 h-7 bg-white rounded-md shadow-xs flex items-center justify-center text-slate-600 hover:bg-slate-100 font-bold">-</button>
                            <span id="qty-${p.id}" class="text-xs font-bold px-2">${qty}</span>
                            <button onclick="changeQty(${p.id}, 1)" class="w-7 h-7 bg-emerald-600 text-white rounded-md shadow-xs flex items-center justify-center hover:bg-emerald-700 font-bold">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateCardQtyDisplay(productId) {
            let variantSelect = document.getElementById(`var-${productId}`);
            let variant = variantSelect ? variantSelect.value : 'default';
            let key = `${productId}_${variant}`;
            let qty = cart[key] || 0;
            let qtySpan = document.getElementById(`qty-${productId}`);
            if (qtySpan) qtySpan.innerText = qty;
        }

        function changeQty(productId, delta) {
            let key = `${productId}_default`;
            let variantSelect = document.getElementById(`var-${productId}`);
            if (variantSelect) {
                let variant = variantSelect.value;
                key = `${productId}_${variant}`;
            }

            if (!cart[key]) cart[key] = 0;
            cart[key] += delta;

            if (cart[key] <= 0) {
                delete cart[key];
            }

            updateCardQtyDisplay(productId);
            updateCartUI();
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;

            for (let key in cart) {
                let [id] = key.split('_');
                let p = products.find(item => item.id == id);
                if (p) {
                    totalItems += cart[key];
                    totalPrice += p.price * cart[key];
                }
            }

            document.getElementById('cartCountSummary').innerText = totalItems;
            document.getElementById('cartTotalSummary').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;

            let cartBar = document.getElementById('cartBar');
            if (totalItems > 0) {
                cartBar.classList.remove('hidden');
            } else {
                cartBar.classList.add('hidden');
            }
        }

        function filterProducts() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let category = document.getElementById('categoryFilter').value;
            let sort = document.getElementById('sortFilter').value;

            let filtered = products.filter(p => {
                let matchName = p.name.toLowerCase().includes(keyword);
                let matchCat = (category === 'all' || p.category === category);
                return matchName && matchCat;
            });

            if (sort === 'low-high') filtered.sort((a,b) => a.price - b.price);
            if (sort === 'high-low') filtered.sort((a,b) => b.price - a.price);

            renderProducts(filtered);
        }

        function openCheckoutModal() {
            let list = document.getElementById('checkoutItemsList');
            list.innerHTML = '';
            let grandTotal = 0;

            for (let key in cart) {
                if (cart[key] > 0) {
                    let parts = key.split('_');
                    let id = parts[0];
                    let variant = parts.slice(1).join('_');
                    let p = products.find(item => item.id == id);
                    if (p) {
                        let subtotal = p.price * cart[key];
                        grandTotal += subtotal;

                        let itemDiv = document.createElement('div');
                        itemDiv.className = "py-2 flex justify-between items-center text-xs";
                        itemDiv.innerHTML = `
                            <div>
                                <p class="font-semibold text-slate-800">${p.name} ${variant && variant !== 'default' ? '('+variant+')' : ''}</p>
                                <p class="text-slate-500">Rp ${p.price.toLocaleString('id-ID')} x ${cart[key]}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-emerald-700">Rp ${subtotal.toLocaleString('id-ID')}</span>
                            </div>
                        `;
                        list.appendChild(itemDiv);
                    }
                }
            }

            document.getElementById('checkoutGrandTotal').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkoutModal').classList.add('hidden'); }

        function proceedToWhatsApp() {
            let text = "Halo Sembako Mas Irul, saya mau pesan:\n\n";
            let total = 0;
            for (let key in cart) {
                let parts = key.split('_');
                let id = parts[0];
                let variant = parts.slice(1).join('_');
                let p = products.find(item => item.id == id);
                if (p) {
                    let subtotal = p.price * cart[key];
                    total += subtotal;
                    text += `- ${p.name} ${variant && variant !== 'default' ? '('+variant+')' : ''} x${cart[key]} : Rp ${subtotal.toLocaleString('id-ID')}\n`;
                }
            }
            text += `\n*Total Belanja: Rp ${total.toLocaleString('id-ID')}*`;
            window.open(`https://wa.me/6288221855849?text=${encodeURIComponent(text)}`, '_blank');
        }

        fetchProductsFromSheet();
    </script>
</body>
</html>
